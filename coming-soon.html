<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon - Lumina</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-color);
      text-align: center;
    }
    .coming-soon-content {
      max-width: 600px;
    }
  </style>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body>

  <div class="container coming-soon-content animate-on-scroll">
    <h1 style="font-size: 4rem;">Something Magical is Coming</h1>
    <p class="lead-text" style="color: var(--text-muted); margin: 1rem 0 3rem;">We are aligning our energy and will be launching soon. Join the waitlist to be notified.</p>
    
    <form class="flex-center wrap-md gap-2">
      <input type="email" placeholder="Your Email Address" style="flex:1; padding: 1rem; border-radius: 5px; border: 1px solid var(--border-color); width: 100%;">
      <button type="submit" class="btn btn-primary">Notify Me</button>
    </form>
    
    <div style="margin-top: 3rem;">
      <a href="index.html" style="color: var(--clr-primary); font-weight: 520;">&larr; Back to Home</a>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <!-- Back to Top Button -->
  <button class="back-to-top" id="backToTop" aria-label="Back to Top"><i class="ph ph-arrow-up"></i></button>
</body>
</html>
