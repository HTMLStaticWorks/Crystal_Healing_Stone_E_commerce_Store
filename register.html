<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Lumina</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body class="auth-page-centered">
  
  <!-- Floating Actions (Theme/RTL) -->
  <div class="auth-floating-actions">
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle Dark Mode"><i class="ph ph-moon"></i></button>
    <button id="rtl-toggle" class="icon-btn" aria-label="Toggle RTL"><i class="ph ph-arrows-left-right"></i></button>
  </div>

  <div class="auth-card animate-on-scroll">
    <div class="auth-header text-center-md" style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="auth-logo"><svg class="lumina-logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 1.5em; height: 1.5em; vertical-align: middle; margin-right: 0.35rem;"><path d="M12 2L2 10L12 22L22 10L12 2Z" fill="url(#lumina-grad-main)" stroke="var(--clr-primary)" stroke-width="1.5" stroke-linejoin="round"/><path d="M2 10H22M12 2V22" stroke="var(--clr-primary)" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 10L12 2L17 10" stroke="var(--clr-primary)" stroke-width="1.5" stroke-linejoin="round"/><defs><linearGradient id="lumina-grad-main" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="var(--clr-primary)" stop-opacity="0.2"/><stop offset="1" stop-color="var(--clr-accent)" stop-opacity="0.8"/></linearGradient></defs></svg> LUMINA</a>
      <h2 style="margin-top: 1rem; margin-bottom: 0.25rem; font-size: 1.6rem; font-weight: 560;">Create Account</h2>
      <p style="color: var(--text-muted); margin-top: 0.25rem; font-size: 0.95rem;">Create an account and start your journey.</p>
    </div>
    
    <form class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="premium-select" placeholder="Handle" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="premium-select" placeholder="name@example.com" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="password" class="premium-select" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
          <button type="button" class="icon-btn password-toggle-btn"><i class="ph ph-eye"></i></button>
        </div>
      </div>
      
      <div class="mb-4 mt-2">
        <label class="checkbox-label" style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--text-color); cursor: pointer;">
          <input type="checkbox" required style="accent-color: var(--clr-primary); width: 16px; height: 16px;"> I accept the <a href="#" class="auth-link">Terms and Conditions</a>
        </label>
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; border-radius: 8px; padding: 0.8rem;">Create Account</button>
    </form>
    
    <div class="divider">or</div>
    
    <div class="social-login-row">
      <button class="btn btn-outline social-btn-horizontal">
        <i class="ph ph-google-logo"></i> Google
      </button>
      <button class="btn btn-outline social-btn-horizontal">
        <i class="ph ph-apple-logo"></i> Apple
      </button>
    </div>
    
    <p style="text-align: center; margin-top: 2rem; font-size: 0.875rem; color: var(--text-muted);">
      Already have an account? <a href="login.html" class="auth-link">Sign in</a>
    </p>
  </div>

  <script src="assets/js/main.js"></script>
  <!-- Back to Top Button -->
  <button class="back-to-top" id="backToTop" aria-label="Back to Top"><i class="ph ph-arrow-up"></i></button>
</body>
</html>
